name: Preschool Wonder isolated CI
on:
  pull_request:
    paths:
      - "src/routes/virtual-preschool.tsx"
      - "src/components/preschool/wonder/**"
      - "tests/e2e/preschool-wonder.spec.ts"
      - ".github/workflows/preschool-wonder.yml"
  push:
    branches:
      - feat/preschool-playful-learning-20261029
permissions:
  contents: read
jobs:
  build-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint new preschool files
        run: npx eslint src/components/preschool/wonder src/routes/virtual-preschool.tsx tests/e2e/preschool-wonder.spec.ts
      - name: Verify production build
        run: npm run build
      - name: Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ps-wonder-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ps-wonder-preview.log
          exit 1
      - name: Actual child and parent workflows
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-wonder.spec.ts --workers=1
