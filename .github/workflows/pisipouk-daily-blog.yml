name: PISIPOUK Daily Blog Publisher
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: pisipouk-daily-blog
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate unique Greek parent article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/daily-blog.mjs
      - name: Build and validate before publishing
        run: |
          npm ci
          npm run build
      - name: Publish changed article and sitemap to GitHub
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new article; done."
            exit 0
          fi
          git config user.name "pisipouk-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blogArticles.ts public/sitemap.xml public/robots.txt
          git commit -m "content(blog): daily Greek preschool article $(date -u +%F)"
          git push origin HEAD:main
