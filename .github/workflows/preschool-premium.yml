name: Pisipouk Premium Preschool QA
on:
  push:
    branches:
      - feat/pisipouk-premium-learning-studio-20261029
  pull_request:
    paths:
      - "src/components/preschool/premium/**"
      - "src/components/preschool/wonder/PreschoolWonder.tsx"
      - "tests/e2e/preschool-premium.spec.ts"
      - ".github/workflows/preschool-premium.yml"
permissions:
  contents: read
jobs:
  premium-preschool:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new code in runner
        run: npx prettier --write src/components/preschool/premium src/components/preschool/wonder/PreschoolWonder.tsx tests/e2e/preschool-premium.spec.ts
      - name: Lint
        run: npx eslint src/components/preschool/premium src/components/preschool/wonder/PreschoolWonder.tsx tests/e2e/preschool-premium.spec.ts
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ps-premium.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ps-premium.log
          exit 1
      - name: Test premium child workflows
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-premium.spec.ts --workers=1
      - name: Capture mobile/desktop screenshots
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-premium-visual.spec.ts --workers=1
      - name: Upload actual screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pisipouk-premium-visual
          path: test-results/pisipouk-premium-visual/
          if-no-files-found: warn
          retention-days: 14
