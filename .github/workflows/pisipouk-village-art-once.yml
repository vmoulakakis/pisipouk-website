name: PISIPOUK Village Artwork (one-time)
on:
  push:
    branches: [feature/pisipouk-world-v17-design]
    paths: [.github/workflows/pisipouk-village-art-once.yml]
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate approved PISIPOUK artwork
        env:
          ART_URL: "https://media.canva.com/v2/document-image/hash:1387354909/height:316/id:DAHX5CXZT00/type:B/width:632?brand=BABnqDZPneM&csig=AAAAAAAAAAAAAAAAAAAAAK4ea0-TCTwLGfUARWKWIKVmh9mtPGQjUDL3rraN7Zw9&disableexport=T&exp=1791896274&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FXZT00%2FDAHX5CXZT00%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261013%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261013T095445Z%26X-Amz-Expires%3D13689%26X-Amz-Signature%3D564895a1763ace63b6eb19a57d250bc4fe9b1aa7e1420f1ae22ddcfa88d25971%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252013%2520Oct%25202026%252013%253A42%253A54%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKSnuw5pm3t_fh9dJNlQQn3rimFuh1wfvRsT2yR0uYQX&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 "$ART_URL" -o /tmp/pisipouk-village.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/pisipouk-village.png').convert('RGB')
          assert im.width >= 600 and im.height >= 300, 'Invalid illustration size'
          im.save('public/preschool/world360/village.webp',format='WEBP',quality=88,method=6)
          print('Converted approved artwork',im.size)
          PY
      - name: Commit local asset to feature branch
        run: |
          git config user.name "PISIPOUK Art Bot"
          git config user.email "artbot@users.noreply.github.com"
          git add public/preschool/world360/village.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(preschool): integrate supplied fantasy-village art"
            git push origin HEAD:feature/pisipouk-world-v17-design
          fi
