name: Preschool V16 Lock Bootstrap

on:
  push:
    branches:
      - feature/preschool-v16-r3f
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preschool-v16-r3f
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(preschool): lock V16 3D runtime dependencies"
          git push origin HEAD:feature/preschool-v16-r3f
