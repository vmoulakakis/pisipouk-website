name: Preschool V8 Mobile QA

on:
  push:
    branches:
      - feature/pisipouk-v8-mobile-pwa
      - main
    paths:
      - "src/components/preschool/**"
      - "src/components/site/SiteLayout.tsx"
      - "public/pisipouk.webmanifest"
      - "public/pisipouk-sw.js"
      - "public/preschool-*.json"
      - "tests/e2e/preschool-v8-100.spec.ts"
      - "playwright.v8.config.ts"
      - "index.html"
      - ".github/workflows/preschool-v8-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-100-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate preschool content
        run: node scripts/validate_preschool_content.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start local app
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pisipouk-v8.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pisipouk-v8.log
          exit 1
      - name: Android Chromium · full 100-scenario suite
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v8-100.spec.ts --config=playwright.v8.config.ts --project=android-chromium
      - name: Apple WebKit · critical child parent install suite
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v8-100.spec.ts --config=playwright.v8.config.ts --project=apple-webkit --grep "PWA|strict parent|iPhone portrait|navigation 390px"
      - name: iPad WebKit · tablet interaction suite
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v8-100.spec.ts --config=playwright.v8.config.ts --project=ipad-webkit --grep "tablet|creative|stories|move"
