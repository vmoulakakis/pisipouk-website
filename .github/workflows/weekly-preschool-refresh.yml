name: Weekly Preschool Refresh

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-preschool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate current preschool content
        run: node scripts/validate_preschool_content.mjs

      - name: Prepare weekly selection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/weekly_preschool_refresh.mjs

      - name: Enforce automation scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ ${#changed[@]} -eq 0 ]; then
            echo "No weekly content change."
            exit 0
          fi
          printf 'Changed files:\n%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            if [ "$file" != "public/preschool-weekly.json" ]; then
              echo "Refusing to continue: weekly job may only edit public/preschool-weekly.json"
              exit 1
            fi
          done

      - name: Validate updated weekly shelf
        run: node scripts/validate_preschool_content.mjs

      - name: Production build gate
        run: npm run build

      - name: Commit only validated weekly data
        shell: bash
        run: |
          if git diff --quiet -- public/preschool-weekly.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "pisipouk-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/preschool-weekly.json
          git commit -m "content: refresh weekly preschool picks"
          git push origin HEAD:main
