name: Pisipouk November 2026 V12 Monthly Pack QA
on:
  push:
    branches:
      - feature/preschool-monthly-2026-11-v12
  pull_request:
    branches:
      - main
    paths:
      - "src/components/preschool/**"
      - "src/routes/virtual-preschool.tsx"
      - "public/preschool-*"
      - "public/activities/november-2026/**"
      - "public/sitemap.xml"
      - "tests/e2e/preschool-*"
      - "scripts/validate_november_2026.mjs"
      - "playwright.november.config.ts"
permissions:
  contents: read
jobs:
  content-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Existing preschool catalog validation
        run: node scripts/validate_preschool_content.mjs
      - name: November content and asset validation
        run: node scripts/validate_november_2026.mjs
      - name: Scoped November TypeScript gate
        run: npx tsc --noEmit -p tsconfig.november.json
      - name: Full-repo baseline TypeScript audit (existing unrelated errors recorded)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Scoped November ESLint gate
        run: |
          npx eslint src/components/preschool/monthly src/routes/virtual-preschool.tsx --rule "prettier/prettier: off"
      - name: Full-repo baseline ESLint audit
        continue-on-error: true
        run: npm run lint
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start preview
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pisipouk-november.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pisipouk-november.log
          exit 1
      - name: Existing Wonder and V12 preschool regressions
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-wonder.spec.ts tests/e2e/preschool-v12-3d.spec.ts --workers=2
      - name: November Android, iPhone, iPad, desktop matrix and 100-cycle tests
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test -c playwright.november.config.ts
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pisipouk-november-qa
          path: |
            playwright-report/
            playwright-november-report/
            test-results/
          if-no-files-found: ignore
