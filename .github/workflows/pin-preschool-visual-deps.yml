name: Pin preschool visual packages on feature branch
on:
  push:
    paths:
      - ".github/workflows/pin-preschool-visual-deps.yml"
permissions:
  contents: write
jobs:
  add-reviewed-deps:
    if: github.ref == 'refs/heads/feat/pisipouk-premium-learning-studio-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update version-pinned lockfile without dependency scripts
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit motion@14.6.0 three@0.186.1
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --save-dev @types/three@0.186.0
      - name: Commit dependency contract only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "build(preschool): pin Motion 14.6.0 and Three 0.186.1 for isolated immersive visuals"
          git push origin HEAD:feat/pisipouk-premium-learning-studio-20261029
