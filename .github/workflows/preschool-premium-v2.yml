name: Preschool Premium V2 review
on:
  push:
    branches: [feat/preschool-premium-v2-20261029]
  pull_request:
    paths: ["src/components/preschool/wonder/**", "tests/e2e/preschool-premium-v2.spec.ts"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changes for lint
        run: npx prettier --write src/components/preschool/wonder tests/e2e/preschool-premium-v2.spec.ts
      - name: Lint
        run: npx eslint src/components/preschool/wonder tests/e2e/preschool-premium-v2.spec.ts
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pisipouk-premium.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pisipouk-premium.log
          exit 1
      - name: Browser tests
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-premium-v2.spec.ts --workers=1
