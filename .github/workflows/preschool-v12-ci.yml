name: Preschool V12 3D CI

on:
  push:
    branches:
      - feature/preschool-v12-babylon-age-worlds
      - feature/preschool-v12-gameplay-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v12-build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate existing preschool content
        run: node scripts/validate_preschool_content.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local app
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pisipouk-v12.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pisipouk-v12.log
          exit 1
      - name: V12 age-separated Babylon 3D QA
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v12-3d.spec.ts
      - name: V12 strict gameplay and 100-session QA
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v12-gameplay-matrix.spec.ts
      - name: Upload V12 visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-visual-qa
          path: test-results/v12-visuals/*.png
          if-no-files-found: ignore
          retention-days: 7
