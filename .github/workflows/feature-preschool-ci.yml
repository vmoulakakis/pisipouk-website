name: Feature Preschool CI

on:
  push:
    branches:
      - feature/online-preschool-grace-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate scoped preschool content
        run: node scripts/validate_preschool_content.mjs
      - name: Type/build gate
        run: npm run build
