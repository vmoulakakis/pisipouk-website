name: Feature Preschool CI

on:
  push:
    branches:
      - redesign/virtual-preschool-v9-content-universe
      - feature/preschool-v10-all-techniques
      - feature/preschool-v11-reviewed-content
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate scoped preschool content
        run: node scripts/validate_preschool_content.mjs
      - name: Type/build gate
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pisipouk-vite.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/virtual-preschool >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pisipouk-vite.log
          exit 1
      - name: Legacy V9 content regression
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v9-content.spec.ts
      - name: V11 adaptive interaction tests
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v11.spec.ts
      - name: V11 reviewed play lab tests
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v11-reviewed.spec.ts
      - name: V11 100-cycle child-parent stress regression
        env:
          PRESCHOOL_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/preschool-v11-100-cycles.spec.ts
