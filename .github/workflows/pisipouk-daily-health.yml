name: PISIPOUK Daily Site Health
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check website and create or update incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://www.pisipouk.com';
          const endpoints = ['/', '/robots.txt', '/sitemap.xml'];
          const findings = [];
          for (const path of endpoints) {
            try {
              const response = await fetch(base + path, { signal: AbortSignal.timeout(15000), redirect: 'follow', headers: { 'User-Agent':'PisipoukHealthMonitor/1.0' } });
              const type = response.headers.get('content-type') || '';
              const text = await response.text();
              findings.push({ path, status: response.status, type, bytes: text.length, valid: response.ok && (path === '/' ? /<html/i.test(text) : path.endsWith('.xml') ? /<urlset|<sitemapindex/i.test(text) : /user-agent:/i.test(text)) });
            } catch (error) {
              findings.push({ path, status: 'ERROR', valid: false, message: String(error) });
            }
          }
          const report = '### PISIPOUK daily site health\\n' + findings.map(x => '- '+x.path+': '+JSON.stringify(x)).join('\\n') + '\\n\\nChecked: '+new Date().toISOString();
          console.log(report);
          const failures = findings.filter(x => !x.valid);
          if (!failures.length) process.exit(0);
          const api = 'https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/issues';
          const headers = { 'Authorization':'Bearer '+process.env.GH_TOKEN, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json' };
          const existing = await fetch(api+'?state=open&per_page=100', {headers}).then(r=>r.json());
          const title = '[Automated] PISIPOUK website SEO/health incident';
          const issue = Array.isArray(existing) && existing.find(x=>x.title===title);
          const url = issue ? api+'/'+issue.number+'/comments' : api;
          const body = issue ? {body:report} : {title,body:report,labels:[]};
          const saved = await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
          if (!saved.ok) throw Error('Cannot record incident: HTTP '+saved.status);
          process.exitCode = 1;
          JS
