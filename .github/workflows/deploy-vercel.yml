name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build

# Production deployment is handled by the repository's native Vercel Git integration.
# Keeping deployment out of GitHub Actions avoids duplicate deploys and removes the
# obsolete requirement for a VERCEL_TOKEN repository secret.
