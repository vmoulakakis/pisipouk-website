<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
 <title>Πατρόν Α4 — Το φαναράκι του Πισιπούκ</title>
 <rect width="210" height="297" fill="white"/>
 <g fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M88 83V66a17 17 0 0 1 34 0v17M60 83h90l-14 23H74zM73 106h64l11 85H62zM60 191h90v16H60z"/>
  <path d="M85 122h40l6 54H79zM105 131l4 12 13 1-10 8 3 13-10-7-10 7 3-13-10-8 13-1zM32 128l8 8m-13 15h12m-6 17 8-8m137-32-8 8m13 15h-12m6 17-8-8"/>
 </g>
 <text x="105" y="31" text-anchor="middle" font-family="sans-serif" font-size="7">Το φαναράκι του Πισιπούκ</text>
 <text x="105" y="236" text-anchor="middle" font-family="sans-serif" font-size="4.5">Ζωγράφισε το φαναράκι και δείξε τη σκιά του με έναν φακό.</text>
 <text x="105" y="245" text-anchor="middle" font-family="sans-serif" font-size="4.5">Αν θέλεις να το κόψεις, ζήτησε βοήθεια από έναν μεγάλο.</text>
</svg>
